# English FastSpeech 2 — Model Configuration
# Based on ming024/FastSpeech2 config/LJSpeech/model.yaml

transformer:
  encoder_layer: 4
  encoder_head: 2
  encoder_hidden: 256
  decoder_layer: 4
  decoder_head: 2
  decoder_hidden: 256
  conv_filter_size: 1024
  conv_kernel_size: [9, 1]
  encoder_dropout: 0.2
  decoder_dropout: 0.2

variance_predictor:
  filter_size: 256
  kernel_size: 3
  dropout: 0.5

variance_embedding:
  pitch_quantization: "linear"
  energy_quantization: "linear"
  n_bins: 256

max_seq_len: 1000

# Single-speaker for Svarah (treat all speakers as one for simplicity)
multi_speaker: false

