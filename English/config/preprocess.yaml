# English FastSpeech 2 — Preprocessing Configuration
# Based on ming024/FastSpeech2 config/LJSpeech/preprocess.yaml
# Adapted for Svarah dataset

dataset: "Svarah"

path:
  corpus_path: "./data/svarah"
  lexicon_path: "./lexicon/librispeech-lexicon.txt"
  raw_path: "./data/svarah"
  preprocessed_path: "./data/preprocessed/english"

preprocessing:
  val_size: 512
  text:
    text_cleaners: ["english_cleaners"]
    language: "en"
  audio:
    sampling_rate: 22050
    max_wav_value: 32768.0
  stft:
    filter_length: 1024
    hop_length: 256
    win_length: 1024
  mel:
    n_mel_channels: 80
    mel_fmin: 0.0
    mel_fmax: 8000.0
  pitch:
    feature: "phoneme_level"
    normalization: true
  energy:
    feature: "phoneme_level"
    normalization: true

